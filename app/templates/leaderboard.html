<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b0d12">
  <title>Leaderboard — DrawAI</title>
  <link rel="stylesheet" href="{{ url_for('static', path='/css/leaderboard.css') }}">
  <script src="{{ url_for('static', path='/js/leaderboard.js') }}" defer></script>
</head>
<body>
  <header class="masthead">
    <a class="brand" href="/display"><span class="brand-mark">D</span><span>DrawAI</span></a>
    <a class="back-link" href="/display">← Live game</a>
    <div id="connection" class="connection offline"><i></i><span>Connecting</span></div>
  </header>
  <main>
    <div class="title-row"><div><p>UNIVERSITY OPEN DAY</p><h1>DRAWAI <span>LEADERBOARD</span></h1></div><div class="trophy" aria-hidden="true">★</div></div>
    <section class="board" aria-label="Top scores">
      <div class="board-head"><span>#</span><span>PLAYER</span><span>SCORE</span></div>
      <ol id="leaderboardEntries"><li class="empty">First scores coming soon</li></ol>
    </section>
    <p class="note">Each score is the average of five drawings. The AI's highest recognition confidence for the requested object counts in each round.</p>
  </main>
  <footer><span>FIVE DRAWINGS · ONE SCORE</span><span id="updated">LIVE RESULTS</span></footer>
</body>
</html>
